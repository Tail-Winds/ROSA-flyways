  author: "Michael O'Brien, Matthew Breece, Aaron Carlise, Dewayne Fox, Bradley Wetherbee, and David Secor"
  repo-url: https://github.com/Tail-Winds/ROSA-flyways/tree/main/notebooks
  chapters:
